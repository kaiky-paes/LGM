<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzaria Forno e Código</title>
    <link rel="icon" type="image/x-icon" href="../images/pizza-icon.png">
    <link rel="stylesheet" href="../css/cadastro.css">
</head>

<body>
    <header>
        <img src="../images/logo.png">
        <div>
            <h1>Forno e Código</h1>
            <h2>As melhores pizzas da região.</h2>
        </div>
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="cardapio.html">Cardápio</a></li>
                <li><a id="cart" href="carrinho.html"><img src=../images/carrinho.png></a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="container">
            <form action="endereco.html">
                <h3>Login</h3>

                <div class="logar">
                    <label for="email">E-mail</label>
                    <input id="email" type="email" placeholder="exemplo@email.com" required>
                    <a href="email.html">Esqueci meu e-mail</a>

                    <label for="senha">Senha</label>
                    <input id="senha" type="password" minlength="8" placeholder="•••••••••" required>
                    <a href="senha.html">Esqueci minha senha</a>
                </div>

                <div id="div-manter">
                    <input type="checkbox" id="manter" name="manter">
                    <label for="manter">Manter-me conectado</label>
                </div>

                <input value="Entrar" type="submit">
            </form>
        </section>
    </main>

    <footer>
        <div>
            <span>(11) 91234-5678 | contato@fornoecodigo.com</span>
        </div>
        <p>&copy; 2026 Pizzaria Forno e Código. Todos os direitos reservados.</p>
    </footer>
</body>

</html>
