<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletim Interativo</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <h1>Boletim Interativo</h1>
        <p>Preencha os dados abaixo para calcular sua média.</p>

        <label for="nome">Nome do aluno</label>
        <input id="nome" type="text" placeholder="Ex.: Ana Souza">

        <label for="curso">Curso</label>
        <input id="curso" type="text" placeholder="Ex.: Desenvolvimento de Sistemas">

        <label for="nota1">Primeira nota</label>
        <input id="nota1" type="number" placeholder="Ex.: 7.5">

        <label for="nota2">Segunda nota</label>
        <input id="nota2" type="number" placeholder="Ex.: 8">

        <label for="nota3">Terceira nota</label>
        <input id="nota3" type="number" placeholder="Ex.: 6">

        <button id="calcular">Calcular média</button>
        <button id="limpar" class="secundario">Limpar</button>

        <p id="resultado"></p>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
